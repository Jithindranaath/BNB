[project]
name = "proofstand"
version = "0.0.0"
description = "Agent marketplace for BNB Chain with a verifiable receipt trail. See context.md."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Orchestrator
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sse-starlette",
    # Queue + cache
    "arq",
    "redis",
    # DB
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    # Chain + data
    "web3>=7",
    "httpx",
    "pyyaml",
    "pandas",
    "pyarrow",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
# packages/ and services/ are import roots; no editable install needed.
pythonpath = [".", "packages", "services"]
testpaths = ["tests", "packages", "services"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
markers = [
    "live: hits a real external API / RPC over the network (deselect with -m 'not live')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
# Two source roots: packages/ (shared libs) and services/ (apps). The editable
# install maps both so `python -m data` and `orchestrator.main:app` work without
# PYTHONPATH gymnastics.
package-dir = { "data" = "packages/data", "agents" = "services/agents", "orchestrator" = "services/orchestrator" }
packages = [
    "data",
    "data.sources",
    "data.reference",
    "agents",
    "agents.pcs_rebalancer",
    "agents.bnb_grid",
    "agents.pcs_yield",
    "agents.venus_guard",
    "agents.bsc_sentry",
    "orchestrator",
]

[project.scripts]
data = "data.cli:main"
